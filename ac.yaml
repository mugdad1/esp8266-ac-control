# ESP8266 IR AC control for Home Assistant (ESPHome firmware)
# Frames are synthesized by tx_helper.h - protocol decoded bit-for-bit
# from the original Global Cache captures (verified against all 17).
# UI: AC switch (on/off), AC Temperature 16-25 slider, AC Swing switch,
# AC Fan 0-3 test control (3 = the bit pattern of every original capture,
# mapping to auto/low/mid/high pending live tests).
# Secrets live in secrets.yaml (gitignored) - see secrets.yaml.example.

esphome:
  name: ac-control
  friendly_name: AC Control
  includes:
    - tx_helper.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            int st = id(ac_temp);
            if (st < 16) st = 16;
            if (st > 25) st = 25;
            id(last_on) = id(ac_on);
            id(last_t) = st;
            id(last_sw) = (int) id(ac_swing);
            id(last_fan) = id(ac_fan);

esp8266:
  board: nodemcuv2

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  ap:
    ssid: "AC-Control-Fallback"

captive_portal:

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

sensor:
  - platform: dht
    pin: GPIO5
    model: DHT11
    temperature:
      name: "Room Temperature"
    humidity:
      name: "Room Humidity"
    update_interval: 60s

globals:
  - id: ac_on
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: ac_temp
    type: int
    restore_value: yes
    initial_value: "21"
  - id: ac_swing
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: ac_fan
    type: int
    restore_value: yes
    initial_value: "3"
  - id: last_on
    type: bool
    restore_value: no
    initial_value: "false"
  - id: last_t
    type: int
    restore_value: no
    initial_value: "21"
  - id: last_sw
    type: int
    restore_value: no
    initial_value: "0"
  - id: last_fan
    type: int
    restore_value: no
    initial_value: "3"
  - id: skip_send
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: send_ac
    mode: restart
    then:
      - lambda: |-
          int st = id(ac_temp);
          if (st < 16) st = 16;
          if (st > 25) st = 25;
          int on = (int) id(ac_on);
          int sw = (int) id(ac_swing);
          int fn = id(ac_fan);
          ESP_LOGI("ac", "send: on=%d temp=%d swing=%d fan=%d", on, st, sw, fn);
          if (on == (int) id(last_on) && st == id(last_t) && sw == id(last_sw) && fn == id(last_fan)) {
            id(skip_send) = true;
            return;
          }
          id(skip_send) = false;
          id(last_on) = (bool) on;
          id(last_t) = st;
          id(last_sw) = sw;
          id(last_fan) = fn;
          build_ac_frame(st, fn, sw, on != 0);
      - if:
          condition:
            lambda: "return !id(skip_send);"
          then:
            - remote_transmitter.transmit_raw:
                carrier_frequency: 38000
                code: !lambda |-
                  return std::vector<int>(tx_buf, tx_buf + tx_len);

switch:
  - platform: template
    name: "AC"
    id: ac_power
    lambda: return id(ac_on);
    turn_on_action:
      - lambda: "id(ac_on) = true;"
      - script.execute: send_ac
    turn_off_action:
      - lambda: "id(ac_on) = false;"
      - script.execute: send_ac
  - platform: template
    name: "AC Swing"
    id: ac_swing_sw
    lambda: return id(ac_swing);
    turn_on_action:
      - lambda: "id(ac_swing) = true;"
      - script.execute: send_ac
    turn_off_action:
      - lambda: "id(ac_swing) = false;"
      - script.execute: send_ac

number:
  - platform: template
    name: "AC Temperature"
    id: ac_temp_nb
    min_value: 16
    max_value: 25
    step: 1
    mode: slider
    lambda: return id(ac_temp);
    set_action:
      then:
        - lambda: "id(ac_temp) = (int) x;"
        - script.execute: send_ac
  - platform: template
    name: "AC Fan"
    id: ac_fan_nb
    min_value: 0
    max_value: 3
    step: 1
    mode: box
    lambda: return id(ac_fan);
    set_action:
      then:
        - lambda: "id(ac_fan) = (int) x;"
        - script.execute: send_ac
