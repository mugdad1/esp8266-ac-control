              condition:
                lambda: 'return id(ac).mode != climate::CLIMATE_MODE_OFF && (int) id(ac).target_temperature == 18 && id(ac).swing_mode == climate::CLIMATE_SWING_OFF;'
              then:
            - remote_transmitter.transmit_raw:
