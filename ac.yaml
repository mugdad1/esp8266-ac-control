# ESP8266 IR AC control for Home Assistant (ESPHome firmware)
# Raw Global Cache captures, 38 kHz, one code per mode/temp/swing combo.
# Hardware: IR LED on GPIO4 (D2), DHT11 on GPIO5 (D1).
# Secrets live in secrets.yaml (gitignored) - see secrets.yaml.example.

esphome:
  name: ac-control
  friendly_name: AC Control

esp8266:
  board: nodemcuv2

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_pass
  ap:
    ssid: "AC-Control-Fallback"

captive_portal:

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

sensor:
  - platform: dht
    pin: GPIO5
    model: DHT11
    temperature:
      name: "Room Temperature"
    humidity:
      name: "Room Humidity"
    update_interval: 60s

globals:
  - id: need_send
    type: bool
    restore_value: no
    initial_value: "false"

climate:
  - platform: template
    name: "AC"
    id: ac
    visual:
      min_temperature: 18
      max_temperature: 25
      temperature_step: 1
    modes:
      - MODE_OFF
      - MODE_COOL
    swing_modes:
      - MODE_OFF
      - MODE_VERTICAL
    # Replay the matching raw code on every change. Boot/HA-reconnect states
    # are swallowed by the first_run guard so a power blip never blasts the AC.
    on_state:
      then:
        - lambda: |-
            static std::string last = "";
            static bool first_run = true;
            std::string cur = std::to_string((int) id(ac).mode) + "|" +
                              std::to_string((int) id(ac).target_temperature) + "|" +
                              std::to_string((int) id(ac).swing_mode);
            if (first_run) { first_run = false; last = cur; id(need_send) = false; }
            else { id(need_send) = (cur != last); if (id(need_send)) last = cur; }
        - if:
            condition:
              lambda: "return id(need_send);"
            then:
          - if:
              condition:
                lambda: 'return id(ac).mode == climate::CLIMATE_MODE_OFF;'
              then:
            - remote_transmitter.transmit_raw:
                carrier_frequency: 38000
                raw: [9074,4368,690,1602,692,508,720,476,752,448,720,478,716,482,662,540,660,538,660,538,688,1604,662,538,660,538,694,506,690,510,748,452,722,476,690,510,720,480,658,540,690,508,690,510,688,1604,750,1542,722,478,688,510,690,510,688,508,690,510,690,1602,720,478,692,1600,692,506,690,508,688,1604,748,450,754,19830,748,452,718,480,662,538,688,510,720,480,688,512,660,538,660,540,660,540,690,510,720,478,692,508,714,482,696,1598,658,540,690,510,722,478,720,476,754,446,690,508,690,508,660,538,692,506,662,538,690,510,690,510,690,506,750,452,718,1574,690,1602,692,1600,660,1634,748]
